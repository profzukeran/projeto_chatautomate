    <link rel="stylesheet" href="style.css?v=20261001-2">

</head>

<body data-ia="IA B">

    <div class="container">

        <header>

            <div class="identificacao">

                <span class="icone" aria-hidden="true">✨</span>

                <div>

        </footer>

    </div>

    <script>
        window.IA_NOME = "IA B";
