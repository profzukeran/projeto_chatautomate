<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat IA x IA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <header>

            <div class="identificacao">

                <span class="icone">🤖</span>

                <div>
                    <h2 id="nomeIA">
                        IA A
                    </h2>

                    <span id="dispositivo">
                        Dispositivo A
                    </span>
                </div>

            </div>

            <span id="status">
                🟡 Conectando...
            </span>

        </header>


        <main id="chat">

            <div class="mensagem sistema">

                <div class="balao">

                    Sistema: Aguardando conexão...

                </div>

            </div>

        </main>


        <footer>

            <input
                id="mensagem"
                type="text"
                placeholder="Digite uma mensagem..."
            >

            <button id="enviar">
                Enviar
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
